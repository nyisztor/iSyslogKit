name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One job on purpose: macOS runners are often in short supply, and a second job can sit
  # unassigned until GitHub cancels it.
  test:
    name: Test (macOS) and build (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.txt
      - name: Report failed tests
        if: failure()
        run: |
          # One annotation per failed expectation, so failures are visible on the run page.
          grep -E "recorded an issue|failed after" test-output.txt | head -20 | while IFS= read -r line; do
            echo "::error title=Test failure::${line}"
          done
      - name: Build package for iOS
        run: xcodebuild -scheme iSyslogKit-Package -destination 'generic/platform=iOS' build
      - name: Build example app for iOS
        run: xcodebuild -project Example/iSyslogKitDemo.xcodeproj -scheme iSyslogKitDemo -destination 'generic/platform=iOS Simulator' build
